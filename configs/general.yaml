# Input layout:   {input}/{source}/{dataset}/sequences.fasta
# Output layout:  {output}/{source}/{dataset}/{tool}/msa.*.fasta,
#                 {output}/{source}/{dataset}/ensemble/*.fasta,
#                 {output}/{source}/{dataset}/stats.parquet, ...
# `input` and `output` may point to the same directory.
# Relative paths are resolved against the repository root.
#
# The defaults run the bundled demo data in demo/data/demo/.

general:
  input: demo/data
  output: results
  sources: ["demo"]

  # Bare name -> looked up on PATH (installed by pixi). Or give an explicit path.
  raxml: raxml-ng

  # Seed for shuffling the input order before each aligner run. With a seed, the
  # same input and config give the same ensemble on every run and machine.
  # Set to null to shuffle differently each time.
  seed: 0
