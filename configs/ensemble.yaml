# Ensemble members: one entry per aligner configuration.
#
#   aligner: key into configs/aligners.yaml
#   type:    "default" (one run per parameter combination) or "Muscle5"
#            (Muscle5 generates its own ensemble via -stratified/-replicates)
#   params:  scalar -> passed to every run; list -> one run per value (cartesian
#            product over all list-valued params); ~ -> plain flag without value
#
# Remove an entry to leave that aligner out of the ensemble.

ensemble:
  ClustalO:
    aligner: ClustalO
    type: "default"
    params:
      "--iterations": 6
      "--max-guidetree-iterations": [1, 2, 3, 4]
      "--max-hmm-iterations": [1, 2]

  MAFFT_FFT-NS-2:
    aligner: MAFFT
    type: "default"
    params:
      "--op": [1.1475, 1.4025, 1.6575, 1.9125]
      "--ep": [0.0922, 0.1538]

  MAFFT_L-INS-i:
    aligner: MAFFT
    type: "default"
    params:
      "--localpair": ~
      "--maxiterate": 1000
      "--op": [1.1475, 1.4025, 1.6575, 1.9125]
      "--ep": [0.0922, 0.1538]

  MAFFT_G-INS-i:
    aligner: MAFFT
    type: "default"
    params:
      "--globalpair": ~
      "--maxiterate": 1000
      "--op": [1.1475, 1.4025, 1.6575, 1.9125]
      "--ep": [0.0922, 0.1538]

  Muscle3:
    aligner: Muscle3
    type: "default"
    params:
      "-weight1": ["clustalw", "none"]
      "-weight2": ["clustalw", "none"]
      "-objscore": ["spf", "xp"]

  Muscle5:
    aligner: Muscle5
    type: "Muscle5"
    params:
      "-replicates": 2
