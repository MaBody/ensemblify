aligners: 
    MAFFT:
        path: /path/to/miniconda3/envs/ensemblify/bin/mafft
        cmd: "{aligner} {options} --thread {threads} {input}"
        threads: 8

    ClustalO:
        path: /path/to/miniconda3/envs/ensemblify/bin/clustalo
        cmd: "{aligner} -i {input} -o {output} -v --force {options} --threads={threads}"
        threads: 8

    Muscle3:
        path: /path/to/miniconda3/envs/ensemblify/bin/muscle
        cmd: "{aligner} {options} -in {input} -out {output}"
        threads: 1        

    Muscle5:
        path: /path/to/miniconda3/envs/ensemblify/bin/muscle5.1.linux_intel64
        cmd: "{aligner} -threads {threads} -stratified {options} -align {input} -output {output}"
        threads: 20
    
