
# the set of sequences to be aligned needs to be stored in: 

# work_dir/database/dataset/sequences.fasta

general:

  # Standard
  input: /path/to/work_dir
  output: /path/to/work_dr/
  sources: ["database"]

  raxml: "/path/to/raxml-ng"


